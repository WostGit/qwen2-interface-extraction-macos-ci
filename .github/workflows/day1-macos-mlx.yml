name: day1-macos-mlx

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  run-experiments:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: "0"
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Day-1 extraction experiments
        run: |
          python run_all.py --results_dir results --seeds 0 1 2

      - name: Upload CSV summaries
        uses: actions/upload-artifact@v4
        with:
          name: extraction-csv-results
          path: results/*.csv

      - name: Upload plots
        uses: actions/upload-artifact@v4
        with:
          name: extraction-plots
          path: results/*.png
