name: day1-macos-mlx-extraction

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

jobs:
  run-day1:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Cache MLX model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/mlx
          key: ${{ runner.os }}-mlx-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run end-to-end experiments
        run: |
          python run_all.py

      - name: Upload CSV and plots
        uses: actions/upload-artifact@v4
        with:
          name: day1-results
          path: |
            results/*.csv
            results/*.png
